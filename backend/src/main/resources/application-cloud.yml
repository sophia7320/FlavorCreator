# ============================================
# 微信云托管环境配置 (SPRING_PROFILES_ACTIVE=cloud)
# ============================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

wx:
  app-id: ${WX_APP_ID}
  secret: ${WX_SECRET}

jwt:
  secret: ${JWT_SECRET}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  file:
    path: /var/log/flavor-creator
  level:
    flcr.backend: INFO

flcr:
  storage:
    type: cos
    cos:
      secret-id: ${COS_SECRET_ID}
      secret-key: ${COS_SECRET_KEY}
      region: ${COS_REGION:ap-shanghai}
      bucket: ${COS_BUCKET}

springdoc:
  api-docs:
    enabled: false
